html body > header nav,html body > header .headnav{gap:3px!important;padding:4px!important;border:1px solid rgba(255,255,255,.11)!important;border-radius:14px!important;background:rgba(255,255,255,.055)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.16)!important;-webkit-backdrop-filter:blur(12px)!important;backdrop-filter:blur(12px)!important}
html body > header nav a,html body > header nav button,html body > header .headnav a,html body > header .headnav button,html body > header .back{min-height:42px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:9px 15px!important;border:1px solid transparent!important;border-radius:12px!important;background:transparent!important;color:#d7d9de!important;font:600 14px/1 Manrope,system-ui,sans-serif!important;letter-spacing:.01em!important;text-decoration:none!important;white-space:nowrap!important;cursor:pointer!important;box-shadow:none!important;transform:translateY(0) scale(1)!important;transition:transform .46s cubic-bezier(.22,1,.36,1),background .32s ease,box-shadow .32s ease,border-color .32s ease,color .32s ease!important}
html body > header nav a:hover,html body > header nav button:hover,html body > header .headnav a:hover,html body > header .headnav button:hover,html body > header .back:hover{background:rgba(255,255,255,.10)!important;border-color:rgba(255,255,255,.10)!important;color:#fff!important;transform:translateY(-1px)!important;box-shadow:0 8px 18px rgba(0,0,0,.16)!important}
html body > header nav button[aria-selected="true"],html body > header nav a[aria-current="page"]{background:linear-gradient(180deg,#e7bd57,#d4a017)!important;color:#111!important;box-shadow:0 5px 16px rgba(215,169,40,.24)!important}
@media(hover:hover) and (pointer:fine){html body > header nav a:hover,html body > header nav button:hover,html body > header .headnav a:hover,html body > header .headnav button:hover{transform:translateY(-2px) scale(1.08)!important}}
@media(max-width:760px){html body > header nav a,html body > header nav button,html body > header .headnav a,html body > header .headnav button,html body > header .back{font-size:12px!important;padding:8px 10px!important;min-height:38px!important}}
@media(prefers-reduced-motion:reduce){html body > header nav a,html body > header nav button,html body > header .headnav a,html body > header .headnav button,html body > header .back{transition:none!important;transform:none!important}}

</style>

<style id="home-header-font-colors">
/* Match header text colors to the Home page: champagne brand, soft-white navigation, white hover, dark active text. */
html body > header :is(.logo,.brand){color:#e3b341!important}
html body > header :is(nav a,nav button,.headnav a,.headnav button,.back){color:#d7d9de!important}
html body > header :is(nav a:hover,nav button:hover,.headnav a:hover,.headnav button:hover,.back:hover){color:#fff!important}
html body > header nav button[aria-selected="true"],html body > header nav a[aria-current="page"],html body > header .headnav button[aria-selected="true"],html body > header .headnav a[aria-current="page"]{color:#111!important}
</style>

<style id="home-reference-typography">
/* Typography matched to the supplied Home-header reference. */
html body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif!important}
html body h1,html body h2,html body h3,html body .logo,html body .brand{font-family:"Playfair Display",Georgia,serif!important}
html body > header .logo,html body > header .brand{font-family:"Playfair Display",Georgia,serif!important;font-size:27px!important;font-weight:700!important;letter-spacing:.03em!important;text-transform:uppercase!important}
html body > header nav a,html body > header nav button,html body > header .headnav a,html body > header .headnav button,html body > header .back{font-family:Manrope,system-ui,sans-serif!important;font-size:14px!important;font-weight:400!important;letter-spacing:0!important}
</style>

<style id="inventory-home-typography-and-grid-alignment">
/* Match the Home header's type hierarchy on the live inventory views. */
html body,html body input,html body select,html body button{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif!important}
html body h1,html body h2,html body h3,html body .logo{font-family:"Playfair Display",Georgia,serif!important}
html body header .logo{font-size:27px!important;font-weight:700!important;letter-spacing:.03em!important;text-transform:uppercase!important;color:#e3b341!important}
html body header .back{font-family:Manrope,system-ui,sans-serif!important;font-size:14px!important;font-weight:400!important;color:#d7d9de!important}
/* The Current inventory panel, filters and vehicle grid share one exact content width. */
main.wrap{width:min(1180px,calc(100% - 48px))!important;max-width:1180px!important;box-sizing:border-box!important}
main.wrap>.hero{display:block!important;width:100%!important;max-width:none!important;box-sizing:border-box!important;margin-left:0!important;margin-right:0!important}
main.wrap>section:not(.hero){width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important}
main.wrap .filters,main.wrap #count,main.wrap #grid,main.wrap .featured-section{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important;margin-left:0!important;margin-right:0!important}
main.wrap #grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:850px){main.wrap #grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main.wrap{width:calc(100% - 24px)!important}main.wrap #grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<style id="inventory-header-glass-surface">
/* Replace the opaque dark inventory header with the translucent Home-style glass card. */
html body>header{
  position:sticky!important;top:14px!important;z-index:1000!important;
  width:calc(100% - 48px)!important;max-width:1160px!important;
  margin:14px auto 12px!important;box-sizing:border-box!important;
  background:linear-gradient(115deg,rgba(255,255,255,.105),rgba(255,255,255,.045))!important;
  border:1px solid rgba(255,255,255,.17)!important;border-radius:28px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 12px 34px rgba(0,0,0,.16)!important;
  -webkit-backdrop-filter:blur(26px) saturate(145%)!important;
  backdrop-filter:blur(26px) saturate(145%)!important;
}
html body>header>.wrap{background:transparent!important;border:0!important;box-shadow:none!important}
@media(max-width:560px){html body>header{width:calc(100% - 24px)!important;margin:10px auto!important;border-radius:20px!important;top:8px!important}}
</style>

<style id="inventory-header-no-borders">
/* Keep the frosted glass header clean and borderless. */
html body>header{border:0!important;border-bottom:0!important;outline:0!important;box-shadow:0 12px 34px rgba(0,0,0,.16)!important}
html body>header>.wrap{border:0!important;outline:0!important}
</style>

<style id="inventory-statusbar-clean-grid-alignment">
/* Remove every divider/outline from the inventory status strip and align it exactly with vehicle cards. */
html body main.wrap>.count,
html body main.wrap>#count,
html body main.wrap .inventory-statusbar,
html body main.wrap .statusbar{
  display:block!important;width:100%!important;max-width:none!important;min-width:0!important;
  box-sizing:border-box!important;margin:10px 0 16px!important;padding:8px 0!important;
  border:0!important;border-top:0!important;border-bottom:0!important;outline:0!important;
  background:transparent!important;box-shadow:none!important;border-radius:0!important;
}
html body main.wrap>#grid,
html body main.wrap>.grid{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important;box-sizing:border-box!important}
html body>header{border:0!important;border-bottom:0!important;outline:0!important}
html body>header::before,html body>header::after{border:0!important;box-shadow:none!important}
@media(max-width:560px){html body main.wrap>.count,html body main.wrap>#count{padding:7px 0!important;margin:8px 0 12px!important}}
</style>
</head>
<body>

<header><div class="wrap"><div class="logo">3 Pedals Auto KE</div><a class="back" href="/">Home</a></div></header>
<main class="wrap">
<section class="hero"><span class="eyebrow">3 PEDALS AUTO KE</span><h1>Current inventory.</h1><p>Browse vehicles currently approved and listed for sale. Open any car to see its photos, specifications, seller details and WhatsApp contact.</p></section>
<section>
<div class="filters"><input id="q" type="search" placeholder="Search make or model"><select id="make"><option value="">All makes</option></select><select id="max"><option value="0">Any price</option><option value="1000000">Up to KES 1,000,000</option><option value="2000000">Up to KES 2,000,000</option><option value="3500000">Up to KES 3,500,000</option><option value="5000000">Up to KES 5,000,000</option></select><select id="sort"><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="km">Lowest mileage</option></select></div>
<div id="count" class="count">Loading inventory…</div><div id="grid" class="grid"></div>
</section></main>
<dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id),CFG=window.SB_CONFIG||{};const sb=CFG.url&&window.supabase?window.supabase.createClient(CFG.url,CFG.key):null;let cars=[];
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const fmt=n=>Number(n||0).toLocaleString("en-KE");const normWa=x=>{let d=String(x||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(/^0[17]\d{8}$/.test(d))return"254"+d.slice(1);if(/^[17]\d{8}$/.test(d))return"254"+d;if(/^254[17]\d{8}$/.test(d))return d;return d};
function sellerType(r){const raw=String(r?.seller_type||r?.account_type||"").trim().toLowerCase().replace(/[\s_-]+/g," ");if(["yard","dealer","car yard","car dealer","business"].includes(raw))return"yard";if(["private","private seller","individual"].includes(raw))return"private";return [r?.yard_name,r?.yard_location,r?.yard_contact].some(v=>String(v||"").trim())?"yard":"private"}
function rowToCar(r){return {id:r.id,make:r.make||"",model:r.model||"",year:r.year||"",price:r.price||0,km:r.km||0,fuel:r.fuel||"",desc:r.description||"",photos:Array.isArray(r.photos)?r.photos:[],promoted:false,seller:{type:sellerType(r),name:r.yard_name||r.seller_name||"",contact:r.contact||r.yard_contact||"",phone:r.seller_phone||r.phone||"",email:r.seller_email||r.email||"",web:r.web||r.yard_web||"",whatsapp:r.whatsapp||"",yard:r.yard_name||"",location:r.yard_location||r.location||"",logo:r.yard_logo_url||r.seller_logo_url||""}}}
function render(){const q=$("q").value.trim().toLowerCase(),mk=$("make").value,mx=+$('max').value,s=$("sort").value;let r=cars.filter(c=>(!q||(c.make+" "+c.model).toLowerCase().includes(q))&&(!mk||c.make===mk)&&(!mx||c.price<=mx));r.sort((a,b)=>(Number(b.promoted)-Number(a.promoted))||(s==="low"?a.price-b.price:s==="high"?b.price-a.price:s==="km"?a.km-b.km:b.year-a.year));$("count").textContent=r.length+(r.length===1?" car":" cars")+" found";$("grid").innerHTML=r.length?r.map((c,i)=>{const p=c.photos[0];return `<button class="card" style="--card-index:${i}" data-id="${esc(c.id)}">${c.promoted?'<span class="featured-label">FEATURED</span>':""}<div class="photo" style="background-image:${p?`url('${esc(p)}')`:"none"}"><span class="year">${esc(c.year)}</span></div><div class="body"><h3>${esc(c.make)} ${esc(c.model)}</h3><div class="price">KES ${fmt(c.price)}</div><div class="tags"><span class="tag">${fmt(c.km)} km</span><span class="tag">${esc(c.fuel)}</span><span class="tag">${c.seller.type==="yard"?"Car yard / dealer":"Private seller"}</span></div>${c.seller.type==="yard"?`<div class="dealer-cardline">${c.seller.logo?`<img src="${esc(c.seller.logo)}" alt="" loading="lazy">`:"🏢"}<span>${esc(c.seller.yard||c.seller.name||"Car yard")}</span></div>`:""}</div></button>`}).join(""):`<div class="empty">No approved cars match your search right now.</div>`}
function detail(id){const c=cars.find(x=>x.id===id);if(!c)return;const d=$("dlg"),s=c.seller,ph=c.photos;const msg=encodeURIComponent(`Hello, I'm interested in the ${c.year} ${c.make} ${c.model} (KES ${fmt(c.price)}) listed on 3 Pedals Auto KE.`);const wa=s.whatsapp?`<a class="btn" href="https://wa.me/${normWa(s.whatsapp)}?text=${msg}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:"";const details=[["Mileage",`${fmt(c.km)} km`],["Fuel",c.fuel||"Not specified"],["Listing type",s.type==="yard"?"Car yard / dealer":"Private seller"],["Location",s.location||"Not specified"]];const facts=items=>`<div class="detail-facts">${items.map(([label,value])=>`<div class="detail-fact"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("")}</div>`;const sellerName=s.type==="yard"?(s.yard||s.name||"Car yard"):(s.name||"Private seller");const sellerInfo=s.type==="yard"?[s.contact,s.location,s.phone,s.email].filter(Boolean).map(esc).join(" · "):s.phone?esc(s.phone):"Contact the seller directly about this listing.";const sellerCard=`<div class="seller-card">${s.logo?`<img class="seller-avatar" src="${esc(s.logo)}" alt="${esc(sellerName)} logo">`:`<div class="seller-avatar" aria-hidden="true">${s.type==="yard"?"🏢":"3P"}</div>`}<div><strong>${esc(sellerName)}</strong><p>${sellerInfo}</p></div></div>`;const specs=[...[ ["Year",c.year||"Not specified"],["Make",c.make||"Not specified"],["Model",c.model||"Not specified"],["Mileage",`${fmt(c.km)} km`],["Fuel",c.fuel||"Not specified"] ]];d.innerHTML=`<div class="detail"><div class="gallery">${ph.length?`<img id="mainimg" class="mainimg" src="${esc(ph[0])}" alt="${esc(c.make+" "+c.model)} photo 1 of ${ph.length}" fetchpriority="high">${ph.length>1?`<div class="thumbs">${ph.map((p,i)=>`<button type="button" data-i="${i}" aria-label="Show photo ${i+1}" aria-current="${i===0}"><img src="${esc(p)}" alt="" loading="lazy"></button>`).join("")}</div>`:""}`:`<div class="mainimg" style="display:grid;place-items:center;color:var(--gold)">No photos available</div>`}</div><article class="info"><div class="detail-heading"><div><span class="eyebrow">${s.type==="yard"?"Car yard listing":"Private listing"}</span><h2>${esc(c.year)} ${esc(c.make)} ${esc(c.model)}</h2></div><div class="detail-price">KES ${fmt(c.price)}</div></div><p class="detail-ref">Vehicle reference: ${esc(String(c.id).slice(0,8).toUpperCase())}</p>${facts(details)}${sellerCard}<section class="detail-section"><h3>About this car</h3><p>${esc(c.desc||"No description provided by the seller.")}</p></section><details class="detail-disclosure"><summary>Specifications</summary>${facts(specs)}</details><p class="detail-note">For your safety, inspect the vehicle in person, verify ownership documents and complete payment only after you are satisfied with the car and paperwork.</p><div class="actions">${wa}${s.phone?`<a class="btn ghost" href="tel:${esc(normWa(s.phone))}">Call seller</a>`:""}<button class="btn ghost" id="close">Close</button></div></article></div>`;let photoIndex=0;const showPhoto=index=>{photoIndex=(index+ph.length)%ph.length;const image=d.querySelector("#mainimg"),counter=d.querySelector(".gallery-count");if(image){image.src=ph[photoIndex];image.alt=`${c.make} ${c.model} — photo ${photoIndex+1} of ${ph.length}`}if(counter)counter.textContent=`${photoIndex+1} / ${ph.length}`;d.querySelectorAll(".thumbs button").forEach((button,i)=>button.setAttribute("aria-current",String(i===photoIndex)))};if(ph.length>1){d.querySelector(".gallery").insertAdjacentHTML("beforeend",`<span class="gallery-count">1 / ${ph.length}</span><button class="gallery-step gallery-prev" type="button" data-gallery-step="-1" aria-label="Previous photo">‹</button><button class="gallery-step gallery-next" type="button" data-gallery-step="1" aria-label="Next photo">›</button>`)}d.showModal();d.querySelectorAll(".thumbs button").forEach(button=>button.onclick=()=>showPhoto(+button.dataset.i));d.querySelectorAll("[data-gallery-step]").forEach(button=>button.onclick=()=>showPhoto(photoIndex+Number(button.dataset.galleryStep)));$("close").onclick=()=>d.close()}
$("grid").onclick=e=>{const b=e.target.closest(".card");if(b)detail(b.dataset.id)};
$("grid").addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const photo=e.target.closest(".photo");if(!photo)return;const r=photo.getBoundingClientRect();photo.style.setProperty("--lens-x",`${((e.clientX-r.left)/r.width)*100}%`);photo.style.setProperty("--lens-y",`${((e.clientY-r.top)/r.height)*100}%`)});
["q","make","max","sort"].forEach(id=>$(id).addEventListener("input",render));
async function load(){if(!sb||!CFG.key||/^PASTE/.test(CFG.key)){$("count").textContent="Inventory unavailable";$("grid").innerHTML='<div class="error">The inventory database is not connected. Check config.js.</div>';return}const {data,error}=await sb.from("listings").select("*").eq("status","approved").order("created_at",{ascending:false});if(error){$("count").textContent="Inventory unavailable";$("grid").innerHTML='<div class="error">We could not load the inventory right now. Please refresh in a moment.</div>';console.error(error);return}const {data:paidPromotions}=await sb.from("active_listing_promotions").select("listing_id");const promoted=new Set((paidPromotions||[]).map(x=>String(x.listing_id)));cars=(data||[]).map(row=>({...rowToCar(row),promoted:promoted.has(String(row.id))}));const makes=[...new Set(cars.map(c=>c.make).filter(Boolean))].sort();$("make").innerHTML='<option value="">All makes</option>'+makes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");render()}load().catch(error=>{console.error("Could not load inventory:",error);$("count").textContent="Inventory unavailable";$("grid").innerHTML='<div class="error">We could not load the inventory right now. Please refresh and try again.</div>'});
</script>
</body></html>
