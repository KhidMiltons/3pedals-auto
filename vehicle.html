function waNumber(v){return String(v||'').replace(/[^\d]/g,'').replace(/^0/,'254');}
function vehicleTitle(r){return `${r.year||''} ${r.make||''} ${r.model||''}`.replace(/\s+/g,' ').trim()}
function setMeta(key,content,property=false){
  const attr=property?'property':'name';
  let el=document.head.querySelector(`meta[${attr}="${key}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,key);document.head.appendChild(el)}
  el.setAttribute('content',content);

function isGarageChecked(r){
  if(!r)return false;
  const boolFlags=[r.garage_inspected,r.pre_purchase_inspected,r.inspection_verified,r.garage_checked,r.is_inspected];
  if(boolFlags.some(v=>v===true||v===1||/^(true|yes|1|verified|passed|checked)$/i.test(String(v||"").trim())))return true;
  const statusVal=String(r.inspection_status||r.garage_inspection_status||"").trim().toLowerCase();
  if(["verified","passed","checked","inspected","approved"].includes(statusVal))return true;
  return /\[\s*3p[- ]garage[- ]checked\s*\]|verified\s+3\s*pedals\s+garage\s+pre[- ]purchase\s+inspection/i.test(String(r.description||""));
}
function cleanListingDescription(raw){
  return String(raw||"").replace(/\s*\[\s*3p[- ]garage[- ]checked\s*\]\s*/gi,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function updateVehicleSeo(r){

  setMeta('description',description);
  setMeta('robots','index,follow');
  setMeta('og:title',seoTitle,true);
  setMeta('og:description',description,true);
  setMeta('og:url',canonicalUrl.toString(),true);
  setMeta('og:type','product',true);
  setMeta('twitter:title',seoTitle);
  setMeta('twitter:description',description);
  const photos=Array.isArray(r.photos)?r.photos.filter(p=>typeof p==='string'&&p.trim()):[];
  if(photos[0]){setMeta('og:image',photos[0],true);setMeta('twitter:image',photos[0])}

  const schema={
    '@context':'https://schema.org',
    '@type':'Vehicle',
    '@id':canonicalUrl.toString()+'#vehicle',
    name:title,
    description:description,
    url:canonicalUrl.toString(),
    itemCondition:'https://schema.org/UsedCondition'
  };
  if(r.make)schema.brand={'@type':'Brand',name:String(r.make)};
  if(r.model)schema.model=String(r.model);
  if(r.year)schema.vehicleModelDate=String(r.year);
  if(r.fuel)schema.fuelType=String(r.fuel);
  if(Number(r.km)>0)schema.mileageFromOdometer={'@type':'QuantitativeValue',value:Number(r.km),unitCode:'KMT',unitText:'km'};
  if(photos.length)schema.image=photos;

    schema.offers={
      '@type':'Offer',
      priceCurrency:'KES',
      price:String(Number(r.price)),

    '@context':'https://schema.org',
    '@type':'BreadcrumbList',
    itemListElement:[
      {'@type':'ListItem',position:1,name:'Home',item:'https://3pedalsauto.co.ke/'},
      {'@type':'ListItem',position:2,name:'Cars for sale',item:'https://3pedalsauto.co.ke/inventory'},
      {'@type':'ListItem',position:3,name:title,item:canonicalUrl.toString()}
    ]
  };
  let breadcrumbData=document.getElementById('vehicle-breadcrumb-structured-data');
  if(!breadcrumbData){breadcrumbData=document.createElement('script');breadcrumbData.id='vehicle-breadcrumb-structured-data';breadcrumbData.type='application/ld+json';document.head.appendChild(breadcrumbData)}
  breadcrumbData.textContent=JSON.stringify(breadcrumbSchema);
}
async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(_e){}

  return false;
}

  const viewer=document.createElement('div');viewer.className='vehicle-photo-viewer no-print';viewer.id='vehiclePhotoViewer';viewer.setAttribute('role','dialog');viewer.setAttribute('aria-modal','true');viewer.setAttribute('aria-label','Full-size vehicle photos');viewer.innerHTML='<button type="button" class="viewer-close" aria-label="Close full-size photo">×</button><button type="button" class="viewer-step viewer-prev" aria-label="Previous photo">‹</button><span class="viewer-count"></span><img alt=""><button type="button" class="viewer-step viewer-next" aria-label="Next photo">›</button>';document.body.appendChild(viewer);
  const syncViewer=()=>{const image=viewer.querySelector('img');image.src=photos[photoIndex];image.alt=`${title} — full-size photo ${photoIndex+1} of ${photos.length}`;viewer.querySelector('.viewer-count').textContent=`${photoIndex+1} / ${photos.length}`};
  const openViewer=()=>{if(!photos.length)return;syncViewer();viewer.classList.add('is-open');document.body.style.overflow='hidden';viewer.querySelector('.viewer-close').focus()};
  const closeViewer=()=>{viewer.classList.remove('is-open');document.body.style.overflow=''};
  $('mainPhoto').addEventListener('click',openViewer);viewer.querySelector('.viewer-close').onclick=closeViewer;viewer.querySelector('.viewer-prev').onclick=()=>{showPhoto(photoIndex-1);syncViewer()};viewer.querySelector('.viewer-next').onclick=()=>{showPhoto(photoIndex+1);syncViewer()};viewer.addEventListener('click',event=>{if(event.target===viewer)closeViewer()});document.addEventListener('keydown',event=>{if(!viewer.classList.contains('is-open'))return;if(event.key==='Escape')closeViewer();if(event.key==='ArrowLeft'){showPhoto(photoIndex-1);syncViewer()}if(event.key==='ArrowRight'){showPhoto(photoIndex+1);syncViewer()}});
if(photos.length>1){document.querySelector('.gallery').insertAdjacentHTML('beforeend',`<span class="photo-count">1 / ${photos.length}</span><button class="photo-step photo-prev" type="button" data-photo-step="-1" aria-label="Previous photo">‹</button><button class="photo-step photo-next" type="button" data-photo-step="1" aria-label="Next photo">›</button>`)}document.querySelectorAll('.thumb').forEach(button=>button.onclick=()=>showPhoto(+button.dataset.photo));document.querySelectorAll('[data-photo-step]').forEach(button=>button.onclick=()=>showPhoto(photoIndex+Number(button.dataset.photoStep)));
  $('shareBtn').onclick=share;
  $('copyLinkBtn').onclick=copyVehicleLink;
  $('copyBtn').onclick=async()=>{const copy=`${title}\nKES ${fmt(r.price)}\nMileage: ${fmt(r.km)} km\nFuel: ${r.fuel||'Not specified'}\nVehicle reference: ${ref}\n${new URL(location.href).href}`;if(await copyText(copy))$('shareFeedback').textContent='Vehicle details copied.';else $('shareFeedback').textContent='Could not access clipboard — select details above to copy.'};

}
async function loadRelated(current){
  const host=document.createElement('section');host.id='relatedVehicles';host.className='related-section no-print';host.setAttribute('aria-label','Similar vehicles');
  host.innerHTML='<div class="related-heading"><div><h2>You may also like</h2><p>More approved vehicles from 3 Pedals Auto KE.</p></div><a class="btn ghost" href="/inventory">View all cars</a></div><div class="related-grid" id="relatedGrid"></div>';
  const vehicle=document.querySelector('.vehicle');if(!vehicle)return;vehicle.insertAdjacentElement('afterend',host);
  try{
    const {data,error}=await sb.from('listings').select('id,make,model,year,price,km,fuel').eq('status','approved').neq('id',String(current.id)).limit(8);
    if(error||!data?.length){host.remove();return}
    const currentMake=String(current.make||'').toLowerCase(),budget=Number(current.price)||0;
    const candidates=data.map(item=>({...item,_score:(String(item.make||'').toLowerCase()===currentMake?3:0)+(budget&&Number(item.price)>0&&Math.abs(Number(item.price)-budget)/budget<=.25?2:0)+(String(item.fuel||'').toLowerCase()===String(current.fuel||'').toLowerCase()?1:0)})).sort((a,b)=>b._score-a._score||Math.abs(Number(a.price||0)-budget)-Math.abs(Number(b.price||0)-budget)).slice(0,3);
    if(!candidates.length){host.remove();return}
    const ids=candidates.map(item=>item.id);
    const {data:photoRows}=await sb.from('listings').select('id,photos').in('id',ids);
    const photosById=new Map((photoRows||[]).map(item=>[item.id,Array.isArray(item.photos)?item.photos.find(p=>typeof p==='string'&&p.trim()):'']));
    $('relatedGrid').innerHTML=candidates.map(item=>{const name=vehicleTitle(item),photo=photosById.get(item.id)||'';return `<a class="related-card" href="/vehicle.html?id=${encodeURIComponent(item.id)}">${photo?`<img class="related-photo" src="${esc(photo)}" alt="${esc(name)}" loading="lazy" decoding="async">`:''}<div class="related-copy"><h3>${esc(name)}</h3><div class="related-price">KES ${fmt(item.price)}</div><div class="related-meta">${fmt(item.km)} km · ${esc(item.fuel||'Fuel not specified')}</div></div></a>`}).join('');
  }catch(error){host.remove();console.warn('Related vehicles could not be loaded:',error)}
}
function hydrateCachedVehicle(targetId){
  const readJson=raw=>{try{return JSON.parse(raw||'null')}catch(_){return null}};
  const key='3pedals:vehicle:v2:'+String(targetId);
  const direct=readJson(localStorage.getItem(key)||sessionStorage.getItem(key));
  const recent=readJson(localStorage.getItem('3pedals:recently-viewed'));
  const inv=readJson(localStorage.getItem('3pedals:inventory-approved:v5')||sessionStorage.getItem('3pedals:inventory-approved:v5'));
  const home=readJson(localStorage.getItem('3pedals:home-approved:v5')||sessionStorage.getItem('3pedals:home-approved:v5'));
  if(window.ThreePedalsLogic?.resolveVehicleFromCaches){
    return window.ThreePedalsLogic.resolveVehicleFromCaches(targetId,[
      direct?.row||direct,
      recent,
      inv?.rows||inv,
      home?.rows||home
    ]);
  }
  const cand=direct?.row||(Array.isArray(recent)&&recent.find(x=>String(x?.id)===String(targetId)))||(Array.isArray(inv?.rows)&&inv.rows.find(x=>String(x?.id)===String(targetId)))||(Array.isArray(home?.rows)&&home.rows.find(x=>String(x?.id)===String(targetId)));
  return cand&&cand.id?cand:null;
}
function shouldRefreshRenderedVehicle(prevRow,nextRow){
  if(!prevRow||!nextRow)return true;
  const prevPhotos=Array.isArray(prevRow.photos)?prevRow.photos.length:0;
  const nextPhotos=Array.isArray(nextRow.photos)?nextRow.photos.length:0;
  return String(prevRow.status||'').toLowerCase()!==String(nextRow.status||'').toLowerCase()
    ||Number(prevRow.price||0)!==Number(nextRow.price||0)
    ||nextPhotos>prevPhotos
    ||String(nextRow.description||'').length>String(prevRow.description||'').length
    ||(!prevRow.seller_phone&&Boolean(nextRow.seller_phone));
}
async function load(){
  const app=$('app');
  if(!id){app.innerHTML='<h2>Vehicle not specified</h2><p>Please return to the Buy section and select a vehicle.</p><a class="btn gold" href="/inventory">Browse cars</a>';return}
  const cacheKey='3pedals:vehicle:v2:'+String(id);
  const cached=hydrateCachedVehicle(id);
  let renderedFromCache=false;
  if(cached&&['approved','sold',''].includes(String(cached.status||'approved').trim().toLowerCase())){
    render(cached);
    renderedFromCache=true;
  }
  if(!sb){
    if(!renderedFromCache)app.innerHTML='<h2>Vehicle details unavailable</h2><p class="desc">The live vehicle database is not connected. Please try again later.</p><a class="btn gold" href="/inventory">Browse cars</a>';
    return;
  }
  try{
    const request=sb.from('listings').select('id,make,model,year,price,km,fuel,description,photos,whatsapp,seller_name,seller_phone,seller_email,yard_name,yard_location,status,created_at,seller_type,contact,yard_web,yard_logo_url').eq('id',id).maybeSingle();
    const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Vehicle request timed out')),15000));
    const {data:r,error}=await Promise.race([request,timeout]);
    if(error){console.error('Vehicle lookup failed:',error);if(!renderedFromCache)app.innerHTML='<h2>Could not load this vehicle</h2><p class="desc">The vehicle details could not be retrieved. Please refresh the page or return to Buy Car and try again.</p><a class="btn gold" href="/inventory">Browse available cars</a>';else loadRelated(cached).catch(()=>{});return}
    if(!r){try{localStorage.removeItem(cacheKey);sessionStorage.removeItem(cacheKey)}catch(_){}const target=$('app')||document.querySelector('main.wrap > .vehicle');if(target)target.innerHTML='<h2>Vehicle unavailable</h2><p class="desc">This vehicle may have been sold, removed, or is no longer available on the website.</p><a class="btn gold" href="/inventory">Browse cars</a>';return}
    try{const value=JSON.stringify({at:Date.now(),row:r});localStorage.setItem(cacheKey,value);sessionStorage.setItem(cacheKey,value)}catch(_){}
    if(!renderedFromCache||shouldRefreshRenderedVehicle(cached,r)){
      const existingViewer=$('vehiclePhotoViewer');if(existingViewer)existingViewer.remove();
      render(r);
    }else{
      window.__listing=r;
    }
    loadRelated(r).catch(error=>console.warn('Related vehicles could not be loaded:',error));
  }catch(error){
    console.error('Vehicle page load failed:',error);
    if(renderedFromCache)loadRelated(cached).catch(()=>{});
    else app.innerHTML='<h2>Vehicle details could not load</h2><p class="desc">The request did not complete. Check your connection and refresh, or browse the available cars below.</p><a class="btn gold" href="/inventory">Browse available cars</a>';
  }
}
load();
</script>

<script id="3pedals-site-media-performance">
(()=>{
 const apply=(root,initial=false)=>{
  const images=[];
  if(root.nodeType===1&&root.matches('img'))images.push(root);
  root.querySelectorAll?.('img').forEach(img=>images.push(img));
  let visible=0;
  images.forEach(img=>{
   if(img.width===1||img.height===1||img.style.display==='none')return;
   if(!img.hasAttribute('decoding'))img.decoding='async';
   if(!img.hasAttribute('loading')){
    img.loading=initial&&visible<2?'eager':'lazy';
    if(initial&&visible<2&&!img.hasAttribute('fetchpriority'))img.fetchPriority='high';
   }
   if(img.loading==='lazy'&&!img.hasAttribute('fetchpriority'))img.fetchPriority='low';
   visible++;
  });
  const videos=[];
  if(root.nodeType===1&&root.matches('video'))videos.push(root);
  root.querySelectorAll?.('video').forEach(video=>videos.push(video));
  videos.forEach(video=>{
   if(!video.hasAttribute('preload'))video.preload='none';
   if(!video.hasAttribute('poster'))video.poster='/project-video-poster.svg';
   if(!video.hasAttribute('playsinline'))video.setAttribute('playsinline','');
   if(!video.hasAttribute('loading'))video.setAttribute('loading','lazy');
  });
 };
 try{apply(document,true)}catch(_){}
 let queue=[],scheduled=false;
 const flush=()=>{scheduled=false;const nodes=queue;queue=[];nodes.forEach(node=>{try{apply(node)}catch(_){}})};
 if(window.MutationObserver&&document.body){
  new MutationObserver(records=>{
   records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)queue.push(node)}));
   if(queue.length&&!scheduled){scheduled=true;requestAnimationFrame(flush)}
  }).observe(document.body,{childList:true,subtree:true});
 }
})();
</script>
