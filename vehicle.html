  let photoIndex=0;const showPhoto=index=>{photoIndex=(index+photos.length)%photos.length;const image=$('mainPhoto'),counter=document.querySelector('.photo-count');image.src=photos[photoIndex];image.alt=`${title} — photo ${photoIndex+1} of ${photos.length}`;if(counter)counter.textContent=`${photoIndex+1} / ${photos.length}`;document.querySelectorAll('.thumb').forEach((button,i)=>button.setAttribute('aria-current',String(i===photoIndex)))};

async function loadRelated(current){
  const host=document.createElement('section');host.id='relatedVehicles';host.className='related-section';host.setAttribute('aria-label','Similar vehicles');
  host.innerHTML='<div class="related-heading"><div><h2>You may also like</h2><p>More approved vehicles from 3 Pedals Auto KE.</p></div><a class="btn ghost" href="/inventory">View all cars</a></div><div class="related-grid" id="relatedGrid"></div>';
  const vehicle=document.querySelector('.vehicle');if(!vehicle)return;vehicle.insertAdjacentElement('afterend',host);
  try{
    const {data,error}=await sb.from('listings').select('id,make,model,year,price,km,fuel').eq('status','approved').neq('id',String(current.id)).limit(8);
    if(error||!data?.length){host.remove();return}
    const currentMake=String(current.make||'').toLowerCase(),budget=Number(current.price)||0;
    const candidates=data.map(item=>({...item,_score:(String(item.make||'').toLowerCase()===currentMake?3:0)+(budget&&Number(item.price)>0&&Math.abs(Number(item.price)-budget)/budget<=.25?2:0)+(String(item.fuel||'').toLowerCase()===String(current.fuel||'').toLowerCase()?1:0)})).sort((a,b)=>b._score-a._score||Math.abs(Number(a.price||0)-budget)-Math.abs(Number(b.price||0)-budget)).slice(0,3);
    if(!candidates.length){host.remove();return}
    const ids=candidates.map(item=>item.id);
    const {data:photoRows}=await sb.from('listings').select('id,photos').in('id',ids);
    const photosById=new Map((photoRows||[]).map(item=>[item.id,Array.isArray(item.photos)?item.photos.find(p=>typeof p==='string'&&p.trim()):'']));
    $('relatedGrid').innerHTML=candidates.map(item=>{const name=vehicleTitle(item),photo=photosById.get(item.id)||'';return `<a class="related-card" href="/vehicle.html?id=${encodeURIComponent(item.id)}">${photo?`<img class="related-photo" src="${esc(photo)}" alt="${esc(name)}" loading="lazy" decoding="async">`:''}<div class="related-copy"><h3>${esc(name)}</h3><div class="related-price">KES ${fmt(item.price)}</div><div class="related-meta">${fmt(item.km)} km · ${esc(item.fuel||'Fuel not specified')}</div></div></a>`}).join('');
  }catch(error){host.remove();console.warn('Related vehicles could not be loaded:',error)}
}
async function load(){
  const app=$('app');
  if(!id){app.innerHTML='<h2>Vehicle not specified</h2><p>Please return to the Buy section and select a vehicle.</p><a class="btn gold" href="/inventory">Browse cars</a>';return}
  if(!sb){app.innerHTML='<h2>Vehicle details unavailable</h2><p class="desc">The live vehicle database is not connected. Please try again later.</p><a class="btn gold" href="/inventory">Browse cars</a>';return}
  const cacheKey='3pedals:vehicle:v2:'+String(id);
  let cached=null,renderedFromCache=false;
  try{const saved=JSON.parse(sessionStorage.getItem(cacheKey)||'null');if(saved&&saved.row&&Date.now()-saved.at<30*60*1000&&saved.row.status==='approved'){cached=saved.row;render(cached);renderedFromCache=true}}catch(_){}
  try{
    const request=sb.from('listings').select('id,make,model,year,price,km,fuel,description,photos,whatsapp,seller_name,seller_phone,seller_email,yard_name,yard_location,status,created_at,seller_type,contact,yard_web,yard_logo_url').eq('id',id).maybeSingle();
    const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Vehicle request timed out')),15000));
    const {data:r,error}=await Promise.race([request,timeout]);
    if(error){console.error('Vehicle lookup failed:',error);if(!renderedFromCache)app.innerHTML='<h2>Could not load this vehicle</h2><p class="desc">The vehicle details could not be retrieved. Please refresh the page or return to Buy Car and try again.</p><a class="btn gold" href="/inventory">Browse available cars</a>';else loadRelated(cached).catch(()=>{});return}
    if(!r){try{sessionStorage.removeItem(cacheKey)}catch(_){}app.innerHTML='<h2>Vehicle unavailable</h2><p class="desc">This vehicle may have been sold, removed, or is no longer available on the website.</p><a class="btn gold" href="/inventory">Browse cars</a>';return}
    render(r);try{sessionStorage.setItem(cacheKey,JSON.stringify({at:Date.now(),row:r}))}catch(_){}
    loadRelated(r).catch(error=>console.warn('Related vehicles could not be loaded:',error));
  }catch(error){
    console.error('Vehicle page load failed:',error);
    if(renderedFromCache)loadRelated(cached).catch(()=>{});
    else app.innerHTML='<h2>Vehicle details could not load</h2><p class="desc">The request did not complete. Check your connection and refresh, or browse the available cars below.</p><a class="btn gold" href="/inventory">Browse available cars</a>';
  }
}
load();
