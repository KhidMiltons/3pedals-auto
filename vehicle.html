<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="color-scheme" content="light dark">
<title>Vehicle Details – 3 Pedals Auto KE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ef;--surface:#fff;--ink:#0d0d0d;--mute:#5e5848;--line:#e3dcc8;--blue:#946c00;--gold:#d4a017;--gold-ink:#0d0d0d;--alt:#0d0d0d;--alt-ink:#e3b341;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0d;--surface:#1a1a1a;--ink:#f5f1e6;--mute:#a8a08a;--line:#333026;--blue:#e3b341;--gold:#e3b341;--gold-ink:#0d0d0d;--alt:#f5f1e6;--alt-ink:#0d0d0d;--err:#ff8a7a}}
*{box-sizing:border-box}body{overscroll-behavior-x:none;margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif}h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.08;margin:0}.wrap{max-width:1120px;margin:auto;padding:0 18px}
header{background:#0d0d0d;color:#fff;border-bottom:3px solid #d4a017}.head{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font:700 27px "Playfair Display",Georgia,serif;color:#e3b341;letter-spacing:.03em;text-transform:uppercase}.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.18);padding:9px 14px;border-radius:8px}.back:hover{border-color:#d4a017;color:#e3b341}
main{padding:28px 0 60px}.crumb{color:var(--mute);font-size:14px;margin-bottom:16px}.state{padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.vehicle{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr);gap:24px;align-items:start}.gallery{position:relative;background:#111;border-radius:16px;overflow:hidden;border:1px solid var(--line);touch-action:pan-y;overscroll-behavior-x:contain}.main-photo{touch-action:pan-y;user-select:none;-webkit-user-drag:none}.photo-step{position:absolute;top:calc(50% - 24px);z-index:3;width:48px;height:56px;padding:0;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(12,13,14,.72);color:#f5f1e6;font-size:34px;line-height:1;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}.photo-step:hover{background:rgba(183,160,106,.7)}.photo-prev{left:12px}.photo-next{right:12px}.photo-count{position:absolute;right:12px;top:12px;z-index:3;padding:5px 8px;border-radius:6px;background:rgba(12,13,14,.72);color:#fff;font-size:12px;font-weight:700}.main-photo{width:100%;aspect-ratio:16/10;object-fit:contain;display:block;background:#17191c}.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:9px}.thumb{border:2px solid transparent;background:#222;border-radius:7px;padding:0;overflow:hidden;cursor:pointer;aspect-ratio:4/3}.thumb[aria-current="true"]{border-color:#d4a017}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}.info h1{font-size:clamp(36px,5vw,56px);margin-top:7px}.year{color:var(--mute);font-family:Manrope,sans-serif;font-size:.55em}.price{font:700 30px "Playfair Display",Georgia,serif;color:var(--blue);margin:12px 0 18px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.spec{padding:12px;border:1px solid var(--line);border-radius:10px}.spec span{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.spec strong{display:block;margin-top:2px}.desc{color:var(--mute);white-space:pre-wrap}.yard-label{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--ink);color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.08em;margin-bottom:9px}.seller{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.seller h3{font-size:24px;margin-bottom:8px}.seller p{margin:4px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:8px;padding:12px 17px;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold);color:var(--gold-ink)}.btn.dark{background:var(--alt);color:var(--alt-ink)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.status{display:inline-flex;align-items:center;gap:7px;margin-top:2px;padding:6px 10px;border-radius:999px;background:#edf7ee;color:#28633a;border:1px solid #c9e5cd;font-size:12px;font-weight:800}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#3b8a4a}.status.sold{background:#fbeaea;color:#8a2020;border-color:#efc7c7}.status.sold:before{background:#b42318}.ref{margin-top:8px;color:var(--mute);font-size:12px}.note{margin-top:18px;padding:13px 15px;border-radius:10px;border:1px solid var(--line);color:var(--mute);font-size:13px}
@media(max-width:820px){.vehicle{grid-template-columns:1fr}.info{padding:20px}}@media(max-width:520px){.head{min-height:68px}.logo{font-size:22px}.back{padding:8px 10px}.thumbs{grid-template-columns:repeat(4,1fr)}.specs{grid-template-columns:1fr}.actions .btn{width:100%;text-align:center}}
</style>
<style id="touch-no-zoom">
@media (max-width: 820px), (hover: none), (pointer: coarse) {
  .card:hover,.card:focus-visible,.tile:hover,.tile:focus-visible,.project-card:hover,.project-card:focus-visible,.contact-card:hover,.panel:hover,.mechanic-card:hover,.btn:hover,.back:hover,.logo:hover,.account-pill:hover,.account-icon:hover,nav button:hover,nav a.navlink:hover,.thumb:hover,.thumbs button:hover,.card:active,.tile:active,.btn:active { transform: none !important; }
  .card:hover img,.card:focus-visible img,.card:hover .swatch,.card:focus-visible .swatch,.project-card:hover img,.project-card:hover video,.account-icon:hover svg { transform: none !important; filter: none !important; }
  .card:hover .photo:before,.card:focus-visible .photo:before { opacity: 0 !important; clip-path: circle(0 at var(--lens-x,50%) var(--lens-y,50%)) !important; }
  .card:hover .photo:after,.card:focus-visible .photo:after { opacity: .45 !important; }
  nav button,nav a.navlink { --dock-scale: 1 !important; }
}
</style>
<style id="site-theme-and-hover">
:root{--bg:#f3f4f6;--surface:rgba(255,255,255,.94);--ink:#111827;--mute:#64748b;--line:#dbe1e8;--blue:#9a7000;--gold:#b7a06a;--gold-ink:#111827;--alt:#17191c;--alt-ink:#f3f4f6}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--surface:rgba(18,24,32,.94);--ink:#f3f4f6;--mute:#9aa6b2;--line:#27313d;--blue:#c9b784;--gold:#c9b784;--gold-ink:#111827;--alt:#f3f4f6;--alt-ink:#111827}}
body{background:radial-gradient(ellipse at 12% -8%,rgba(183,160,106,.13),transparent 34%),radial-gradient(ellipse at 96% 20%,rgba(255,255,255,.035),transparent 30%),var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(8,10,13,.82);border-bottom:1px solid rgba(183,160,106,.2);box-shadow:0 8px 30px rgba(0,0,0,.22);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.logo{color:#c9b784}.back{border-color:rgba(183,160,106,.26);border-radius:10px;background:rgba(255,255,255,.045);transition:transform .2s ease,border-color .2s ease,background .2s ease,color .2s ease,box-shadow .2s ease}
.crumb{color:var(--mute)}.gallery{background:rgba(18,24,32,.84);border-color:rgba(183,160,106,.22);box-shadow:0 18px 48px rgba(0,0,0,.18)}.main-photo{background:#121820}.thumbs{background:rgba(18,24,32,.82)}.thumb{transition:transform .2s ease,border-color .2s ease,filter .2s ease}.thumb[aria-current="true"]{border-color:var(--gold)}
.info{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--surface);border-color:rgba(183,160,106,.22);box-shadow:0 18px 48px rgba(0,0,0,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .24s ease,box-shadow .24s ease}.eyebrow{color:var(--gold)}.price{color:var(--gold)}.status{box-shadow:0 5px 16px rgba(46,125,75,.12)}
.spec{background:rgba(255,255,255,.025);border-color:rgba(183,160,106,.16)}.spec span{color:var(--mute)}.seller{border-color:rgba(183,160,106,.20)}.seller a,.info a:not(.btn){color:var(--gold);transition:color .2s ease}.note{border-color:rgba(183,160,106,.20);background:rgba(183,160,106,.06)}
.btn{transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease,color .2s ease}.btn.gold{background:linear-gradient(135deg,#d5c18d,#b7a06a);color:#151515}.btn.dark{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:rgba(255,255,255,.035);border-color:var(--line);color:var(--ink)}
@media(hover:hover) and (pointer:fine){.back:hover{transform:translateY(-1px);border-color:rgba(183,160,106,.58);background:rgba(183,160,106,.10);color:#e5d6ad;box-shadow:0 8px 22px rgba(0,0,0,.18)}.logo:hover{color:#e5d6ad}.photo-step:hover{transform:translateY(-2px);background:rgba(183,160,106,.78);border-color:rgba(255,255,255,.4);box-shadow:0 8px 22px rgba(0,0,0,.25)}.thumb:hover{transform:translateY(-2px);filter:brightness(1.08)}.gallery:hover .main-photo{filter:saturate(1.04) brightness(1.025)}.info:hover{border-color:rgba(183,160,106,.4);box-shadow:0 22px 58px rgba(0,0,0,.26)}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.24)}.info a:not(.btn):hover{color:#f0dfb0}}
@media(prefers-reduced-motion:reduce){.back,.thumb,.photo-step,.btn,.info,.main-photo{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap head"><a class="logo" href="/">3 Pedals Auto KE</a><a class="back" href="index.html#buy">← Back to Buy</a></div></header>
<main class="wrap">
  <div class="crumb">3 Pedals Auto KE / Vehicle details</div>
  <div id="app" class="state">Loading vehicle…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const CFG=window.SB_CONFIG||{};
const sb=(CFG.url&&!/^PASTE/.test(CFG.url)&&window.supabase)?window.supabase.createClient(CFG.url,CFG.key):null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-KE');
const qs=new URLSearchParams(location.search);const id=qs.get('id');
function waNumber(v){return String(v||'').replace(/[^\d]/g,'').replace(/^0/,'254');}
function vehicleTitle(r){return `${r.year||''} ${r.make||''} ${r.model||''}`.replace(/\s+/g,' ').trim()}
async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(_e){}
  try{const field=document.createElement('textarea');field.value=text;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();if(copied)return true}catch(_e){}
  return false;
}
async function copyVehicleLink(){const url=new URL(location.href).href,feedback=$('shareFeedback');if(await copyText(url)){feedback.textContent='Vehicle link copied — ready to share.';return}prompt('Copy this vehicle link:',url)}
async function share(){
  const listing=window.__listing,title=vehicleTitle(listing),url=new URL(location.href).href,text=`${title} — KES ${fmt(listing.price)} on 3 Pedals Auto KE`;
  if(navigator.share){try{await navigator.share({title,text,url});return}catch(error){if(error?.name==='AbortError')return}}
  await copyVehicleLink();
}
function render(r){
  window.__listing=r;
  const photos=Array.isArray(r.photos)?r.photos.filter(Boolean):[];
  const title=vehicleTitle(r);const phone=r.seller_phone||r.phone||'';const whatsapp=r.whatsapp||phone;const wa=waNumber(whatsapp);
  const ref=`3PA-${String(r.id||"").replace(/-/g,"").slice(0,8).toUpperCase()}`;
  const msg=`Hello 3 Pedals Auto KE, I'm interested in the ${title} listed at KES ${fmt(r.price)}. Vehicle reference: ${ref}. Is it still available?`;
  const gallery=photos.length?`<div class="gallery"><img id="mainPhoto" class="main-photo" src="${esc(photos[0])}" alt="${esc(title)} photo 1" fetchpriority="high"><div class="thumbs">${photos.map((p,i)=>`<button class="thumb" type="button" data-photo="${i}" aria-current="${i===0}"><img src="${esc(p)}" alt="${esc(title)} photo ${i+1}" loading="lazy"></button>`).join('')}</div></div>`:`<div class="gallery"><div class="main-photo" style="display:grid;place-items:center;color:#e3b341;font:700 42px 'Playfair Display',serif">${esc(r.year||'')}</div></div>`;
  const isYard=r.seller_type==='yard'||!!r.yard_name||!!r.yard_location;
  const sellerName=r.yard_name||r.seller_name||'Seller';
  const location=r.yard_location||r.location||'';
  const mapUrl=location?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`:'';
  const yardLink=isYard?`<a class="btn ghost" href="yard.html?name=${encodeURIComponent(sellerName)}">🏢 View ${esc(sellerName)} profile</a>`:'';
  const sellerBits=[
    isYard?`<div class="yard-label">🏢 CAR YARD LISTING</div>`:'',
    isYard?`<p class="meta">This vehicle is listed by a verified car-yard account on 3 Pedals Auto KE.</p>`:'',
    location?`<p>📍 <strong>${esc(location)}</strong></p>`:'',
    phone?`<p>📞 ${esc(phone)}</p>`:'',
    r.seller_email?`<p>✉️ ${esc(r.seller_email)}</p>`:'',
    r.web?`<p>🌐 <a href="${esc(/^https?:\/\//i.test(r.web)?r.web:'https://'+r.web)}" target="_blank" rel="noopener">${esc(r.web)}</a></p>`:'',
    mapUrl?`<a class="btn ghost" href="${esc(mapUrl)}" target="_blank" rel="noopener">📍 Get directions to this yard</a>`:'',
    yardLink
  ].join('');
  $('app').outerHTML=`<div class="vehicle"><div>${gallery}</div><article class="info"><span class="eyebrow">3 Pedals Auto KE · Approved listing</span><h1>${esc(r.make)} ${esc(r.model)} <span class="year">${esc(r.year||'')}</span></h1><div class="price">KES ${fmt(r.price)}</div><span class="status">Available to enquire</span><div class="ref">Vehicle reference: <strong>${ref}</strong></div><div class="specs"><div class="spec"><span>Mileage</span><strong>${fmt(r.km)} km</strong></div><div class="spec"><span>Fuel</span><strong>${esc(r.fuel||'Not specified')}</strong></div><div class="spec"><span>Make</span><strong>${esc(r.make||'')}</strong></div><div class="spec"><span>Model / Variant</span><strong>${esc(r.model||'')}</strong></div></div><p class="desc">${esc(r.description||'No description provided.')}</p><div class="seller"><h3>${isYard?"Car Yard":"Seller"}</h3><p><strong>${esc(sellerName)}</strong></p>${sellerBits}</div><div class="actions">${wa?`<a class="btn gold" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">💬 WhatsApp Enquiry</a>`:''}${phone?`<a class="btn dark" href="tel:${esc(waNumber(phone))}">📞 Call Seller</a>`:''}<button class="btn ghost" type="button" id="shareBtn">↗ Share vehicle</button><button class="btn ghost" type="button" id="copyLinkBtn">⧉ Copy vehicle link</button><button class="btn ghost" type="button" id="copyBtn">Copy details</button><a class="btn ghost" href="/inventory">← More cars</a></div><span id="shareFeedback" class="meta" role="status" aria-live="polite"></span><div class="note">For your safety, inspect the vehicle in person, verify ownership documents and complete payment only after you are satisfied with the car and paperwork.</div></article></div>`;
  let photoIndex=0;const showPhoto=index=>{photoIndex=(index+photos.length)%photos.length;const image=$('mainPhoto'),counter=document.querySelector('.photo-count');image.src=photos[photoIndex];image.alt=`${title} — photo ${photoIndex+1} of ${photos.length}`;if(counter)counter.textContent=`${photoIndex+1} / ${photos.length}`;document.querySelectorAll('.thumb').forEach((button,i)=>button.setAttribute('aria-current',String(i===photoIndex)))};if(photos.length>1){document.querySelector('.gallery').insertAdjacentHTML('beforeend',`<span class="photo-count">1 / ${photos.length}</span><button class="photo-step photo-prev" type="button" data-photo-step="-1" aria-label="Previous photo">‹</button><button class="photo-step photo-next" type="button" data-photo-step="1" aria-label="Next photo">›</button>`)}document.querySelectorAll('.thumb').forEach(button=>button.onclick=()=>showPhoto(+button.dataset.photo));document.querySelectorAll('[data-photo-step]').forEach(button=>button.onclick=()=>showPhoto(photoIndex+Number(button.dataset.photoStep)));
  $('shareBtn').onclick=share;
  $('copyLinkBtn').onclick=copyVehicleLink;
  $('copyBtn').onclick=async()=>{const copy=`${title}\nKES ${fmt(r.price)}\nMileage: ${fmt(r.km)} km\nFuel: ${r.fuel||'Not specified'}\nVehicle reference: ${ref}\n${new URL(location.href).href}`;if(await copyText(copy))$('shareFeedback').textContent='Vehicle details copied.';else prompt('Copy vehicle details:',copy)};
  document.title=`${title} – 3 Pedals Auto KE`;
}
async function load(){
  if(!id){$('app').innerHTML='<h2>Vehicle not specified</h2><p>Please return to the Buy section and select a vehicle.</p><a class="btn gold" href="/inventory">Browse cars</a>';return}
  if(!sb){$('app').innerHTML='<h2>Vehicle details unavailable</h2><p class="desc">The live vehicle database is not connected.</p>';return}
  const {data:r,error}=await sb.from('listings').select('*').eq('id',id).eq('status','approved').maybeSingle();
  if(error||!r){$('app').innerHTML='<h2>Vehicle unavailable</h2><p class="desc">This vehicle may have been sold, removed, or is no longer available on the website.</p><a class="btn gold" href="/inventory">Browse available cars</a>';return}
  render(r);
}
load();
</script>
</body>
</html>
