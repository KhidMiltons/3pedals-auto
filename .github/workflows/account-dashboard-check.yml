name: Account dashboard static checks

on:
  pull_request:
    paths:
      - "index.html"
      - "account-panel.css"
      - "account-panel.js"
      - ".github/workflows/account-dashboard-check.yml"

permissions:
  contents: read

jobs:
  static-checks:
    name: Dashboard syntax and asset checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check account-panel.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.is_javascript = False
                  self.current = []
                  self.scripts = []
                  self.external_scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  self.in_script = True
                  self.external = bool(attrs.get("src"))
                  script_type = (attrs.get("type") or "").lower()
                  self.is_javascript = not script_type or script_type in ("text/javascript", "application/javascript", "module")
                  if self.external:
                      self.external_scripts.append(attrs["src"])
                  self.current = []

              def handle_data(self, data):
                  if self.in_script and not self.external and self.is_javascript:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and self.is_javascript:
                          self.scripts.append("".join(self.current))
                      self.in_script = False
                      self.external = False
                      self.is_javascript = False
                      self.current = []

          parser = InlineScripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          assert parser.scripts, "No inline scripts found in index.html"
          assert any(src.startswith("account-panel.js?") for src in parser.external_scripts), "account-panel.js is not linked"
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(parser.scripts):
                  path = Path(temp) / f"inline-{index}.js"
                  path.write_text(script, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
                  if result.returncode:
                      raise SystemExit(f"Inline script {index} failed syntax validation:\n{result.stderr}")
          print(f"Validated {len(parser.scripts)} inline JavaScript blocks and account-panel.js")
          PY

      - name: Check dashboard assets and CSS structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("account-panel.css").read_text(encoding="utf-8")
          links = [line for line in html.splitlines() if '<link rel="stylesheet"' in line and "account-panel.css" in line]
          assert len(links) == 1, f"Expected one account-panel.css link, found {len(links)}"
          assert "account-panel.css?v=20261105-glassy-v2-4" in links[0], "Unexpected dashboard CSS cache version"
          assert "dlejmelyeaaxcvelvzia.supabase.co" in html, "Expected Supabase project URL was not found"
          assert css.count("{") == css.count("}"), "Unbalanced CSS braces"
          depth = 0
          for offset, char in enumerate(css):
              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1
                  assert depth >= 0, f"Unexpected closing CSS brace near character {offset}"
          assert depth == 0, f"Unbalanced CSS braces: final depth {depth}"
          print("Validated stylesheet link, cache version, Supabase reference, and CSS brace balance")
          PY
