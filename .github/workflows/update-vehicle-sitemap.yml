
name: Update vehicle sitemap

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-vehicle-sitemap.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vehicle-sitemap
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already up to date."
          else
            git commit -m "Update sitemap with approved vehicle listings"
            git push
          fi
