<style>
:root{color-scheme:dark;--bg:#0d0d0d;--surface:#1b1c1d;--ink:#f5f1e6;--mute:#aaa18e;--line:rgba(201,183,132,.22);--gold:#c9b784;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.7 Manrope,system-ui,sans-serif;background:radial-gradient(ellipse at 10% -10%,rgba(201,183,132,.13),transparent 34%),#0d0d0d}a{color:inherit}.head{position:sticky;top:0;z-index:4;background:rgba(17,18,19,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.headin,main,footer{width:min(1100px,calc(100% - 36px));margin:auto}.headin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font:700 22px/1.1 "Playfair Display",Georgia,serif;color:var(--gold);text-decoration:none}.back{padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04);text-decoration:none;font-weight:700}.back:hover{border-color:var(--gold);color:var(--gold)}main{padding:clamp(36px,7vw,80px) 0 70px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}.article{max-width:900px;margin:auto}.article h1{font:700 clamp(38px,7vw,72px)/1.04 "Playfair Display",Georgia,serif;letter-spacing:-.025em;margin:12px 0}.meta{color:var(--mute);font-size:14px}.cover{width:100%;max-height:620px;object-fit:cover;border:1px solid var(--line);border-radius:18px;margin:28px 0}.body{font-size:clamp(16px,1.4vw,19px);line-height:1.9;overflow-wrap:anywhere}.body p{margin:0 0 1.3em}.body h2,.body h3{font-family:"Playfair Display",Georgia,serif;line-height:1.2}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin:28px 0}.gallery img{width:100%;height:250px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.journal-list{display:grid;gap:14px;margin-top:28px}.story-card{display:grid;grid-template-columns:minmax(180px,.38fr) minmax(0,1fr);gap:20px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(40,40,40,.76),rgba(22,23,24,.82));text-decoration:none;transition:transform .25s var(--ease),border-color .25s}.story-card:hover{transform:translateY(-2px);border-color:var(--gold)}.story-card img{width:100%;height:170px;object-fit:cover;border-radius:10px}.story-card h2{font:700 clamp(22px,3vw,32px)/1.15 "Playfair Display",Georgia,serif;margin:4px 0 8px}.story-card p{margin:0;color:var(--mute)}@media(max-width:620px){.story-card{grid-template-columns:1fr;gap:12px}.story-card img{height:auto;aspect-ratio:16/9}}.state{padding:28px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(40,40,40,.76),rgba(22,23,24,.82));color:var(--mute)}footer{padding:22px 0 36px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}@media(max-width:560px){.headin,main,footer{width:calc(100% - 24px)}.headin{min-height:60px}.brand{font-size:19px}.back{font-size:13px}.cover{border-radius:12px}.gallery img{height:210px}}
</style>

<body>
<header class="head"><div class="headin"><a class="brand" href="index.html#journal">3 Pedals Auto KE</a><a class="back" href="index.html#journal">← 3 Pedals Journal</a></div></header>
<main><article class="article" id="article"><div class="state">Loading story…</div></article></main>
<footer>3 Pedals Auto KE · Automotive Excellence Reimagined, For Those Who Appreciate the Drive.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const CFG=window.SB_CONFIG||{},sb=CFG.url&&window.supabase?window.supabase.createClient(CFG.url,CFG.key):null,q=new URLSearchParams(location.search),articleId=q.get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mediaFor=p=>Array.isArray(p.media_gallery)&&p.media_gallery.length?p.media_gallery:p.media_url?[{url:p.media_url,type:'image'}]:[];
function meta(selector,value){const el=document.querySelector(selector);if(el)el.setAttribute('content',value)}
function storySlug(title){return String(title||'story').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'story'}
function notFound(message){document.getElementById('article').innerHTML='<div class="state">'+esc(message)+'</div>';document.title='Story unavailable | 3 Pedals Auto KE'}
function render(p){const title=String(p.title||'3 Pedals Journal'),description=String(p.description||'Read '+title+' from the 3 Pedals Auto KE Journal.'),photos=mediaFor(p).filter(m=>m.type!=='video'&&!String(m.mime||'').startsWith('video/')),cover=photos.find(m=>m.is_cover||m.cover)||photos[0],date=p.created_at?new Date(p.created_at).toISOString():undefined,canonical=new URL('journal.html?slug='+encodeURIComponent(storySlug(title))+'&id='+encodeURIComponent(p.id),location.href).href;document.title=title+' | 3 Pedals Auto KE Journal';meta('meta[name="description"]',description);meta('meta[property="og:title"]',title);meta('meta[property="og:description"]',description);meta('meta[property="og:image"]',cover?.url||new URL('favicon.svg',location.href).href);meta('meta[name="twitter:title"]',title);meta('meta[name="twitter:description"]',description);document.getElementById('canonicalUrl').href=canonical;const body=String(p.body||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x).replace(/\n/g,'<br>')+'</p>').join('');document.getElementById('article').innerHTML='<span class="eyebrow">'+esc(p.category||'3 Pedals Journal')+'</span><h1>'+esc(title)+'</h1><p class="meta">3 Pedals Journal'+(date?' · '+esc(new Date(date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})):'')+'</p>'+(cover?'<img class="cover" src="'+esc(cover.url)+'" alt="'+esc(title)+'">':'')+(photos.length>1?'<div class="gallery">'+photos.filter(m=>m!==cover).map((m,i)=>'<img src="'+esc(m.url)+'" alt="'+esc(title)+' — photo '+(i+2)+'" loading="lazy">').join('')+'</div>':'')+'<div class="body">'+body+'</div>';const ld={"@context":"https://schema.org","@type":"Article","headline":title,"description":description,"mainEntityOfPage":canonical,"publisher":{"@type":"Organization","name":"3 Pedals Auto KE","url":location.origin},...(date?{"datePublished":date}:{}),...(cover?{"image":[cover.url]}:{})};let json=document.getElementById('articleStructuredData');if(!json){json=document.createElement('script');json.id='articleStructuredData';json.type='application/ld+json';document.head.append(json)}json.textContent=JSON.stringify(ld)}
function renderIndex(items){document.title='3 Pedals Journal | 3 Pedals Auto KE';document.getElementById('canonicalUrl').href=new URL('journal.html',location.href).href;document.getElementById('article').innerHTML='<span class="eyebrow">3 Pedals Auto KE · Journal</span><h1>Stories for people who love cars.</h1><p class="meta">Public automotive stories, buying advice, ownership notes, and workshop knowledge.</p><div class="journal-list">'+items.map(p=>{const image=mediaFor(p).find(m=>m.is_cover||m.cover)||mediaFor(p)[0],url='journal.html?slug='+encodeURIComponent(storySlug(p.title))+'&id='+encodeURIComponent(p.id);return '<a class="story-card" href="'+esc(url)+'">'+(image?'<img src="'+esc(image.url)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div><span class="eyebrow">'+esc(p.category||'Automotive Journal')+'</span><h2>'+esc(p.title)+'</h2><p>'+esc(p.description||'Read the full story.')+'</p></div></a>'}).join('')+'</div>';meta('meta[name="description"]','Read public automotive stories, buying advice and ownership features from 3 Pedals Auto KE.')}
async function load(){if(!sb){notFound('Journal is unavailable right now. Please try again later.');return}if(!articleId){const {data,error}=await sb.from('projects').select('*').eq('published',true).eq('type','article').order('created_at',{ascending:false});if(error){console.error(error);notFound('Journal is unavailable right now. Please try again later.');return}renderIndex(data||[]);return}const {data,error}=await sb.from('projects').select('*').eq('id',articleId).eq('published',true).eq('type','article').maybeSingle();if(error){console.error(error);notFound('Journal is unavailable right now. Please try again later.');return}if(!data||!data.body){notFound('This article is not available or has not been published.');return}render(data)}load().catch(error=>{console.error(error);notFound('We could not load this story. Please refresh and try again.')});
</script>
