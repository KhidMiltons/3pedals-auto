<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory — 3 Pedals Auto KE</title>
<meta name="description" content="Browse vehicles currently listed for sale by 3 Pedals Auto KE.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#0b0c0e;--panel:#141619;--text:#f4f2ec;--muted:#a9a9a6;--gold:#c6b27f;--line:rgba(255,255,255,.10);--err:#ff7b7b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1b1e 0,#0b0c0e 48%);color:var(--text);font:15px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.86);border-bottom:1px solid rgba(227,179,65,.22);backdrop-filter:blur(18px)}header .wrap{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:24px;font-weight:800;letter-spacing:-.03em}.back{padding:10px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:rgba(255,255,255,.04)}
main{padding:48px 0 70px}.hero{padding:28px 0 24px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:800}.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.02;margin:8px 0 12px;letter-spacing:-.045em}.hero p{max-width:720px;color:var(--muted);font-size:17px}
.filters{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px;margin:20px 0}.filters input,.filters select{width:100%;min-height:46px;background:#111316;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}.count{color:var(--muted);margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:0;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#17191c,#111214);color:inherit;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 12px 32px rgba(0,0,0,.18)}.photo{height:230px;background:#232529 center/cover no-repeat;position:relative}.photo .year{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.72);padding:6px 9px;border-radius:8px;font-weight:800}.body{padding:16px}.body h3{margin:0 0 6px;font-size:21px}.price{font-size:20px;font-weight:800;color:#e4cf98;margin-bottom:9px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px}.empty,.error{padding:28px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);color:var(--muted)}
dialog{width:min(960px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;background:#111315;color:var(--text);padding:0;box-shadow:0 30px 100px rgba(0,0,0,.6)}dialog::backdrop{background:rgba(0,0,0,.72)}.detail{display:grid;grid-template-columns:1.1fr .9fr}.gallery{padding:18px}.mainimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#222}.thumbs{display:flex;gap:8px;margin-top:8px;overflow:auto}.thumbs button{padding:0;border:2px solid transparent;background:none;border-radius:8px;overflow:hidden;min-width:74px}.thumbs button[aria-current=true]{border-color:var(--gold)}.thumbs img{width:74px;height:56px;object-fit:cover;display:block}.info{padding:28px 24px}.info h2{font-size:32px;line-height:1.05;margin:0 0 8px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.specs span,.specs b{padding:10px;border-bottom:1px solid var(--line)}.specs span{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#111;text-decoration:none;font-weight:800}.ghost{background:transparent;color:var(--text);border-color:var(--line)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}@media(max-width:560px){.wrap{width:min(100% - 24px,1180px)}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.hero h1{font-size:42px}.photo{height:220px}}
/* Match the 3 Pedals site and yard profile: champagne-gold accents with translucent glass surfaces. */
:root{--bg:#f3f1ec;--panel:rgba(251,250,247,.82);--text:#1a1b1d;--muted:#77746d;--gold:#b7a06a;--line:#dedbd3;--err:#b42318;--ease:cubic-bezier(.22,1,.36,1);--shadow:0 18px 50px rgba(24,25,27,.10);--dialog-line:rgba(26,27,29,.12);--glass-button:rgba(255,255,255,.42)}
@media(prefers-color-scheme:dark){:root{--bg:#111315;--panel:rgba(24,26,29,.82);--text:#f0eee8;--muted:#9a9891;--gold:#b8a67d;--line:#2d3034;--err:#ff8a7a;--shadow:0 18px 55px rgba(0,0,0,.28);--dialog-line:rgba(255,255,255,.10);--glass-button:rgba(255,255,255,.045)}}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{min-height:100vh;background:radial-gradient(circle at 12% -8%,rgba(183,160,106,.14),transparent 32%),radial-gradient(circle at 88% 8%,rgba(255,255,255,.55),transparent 28%),var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@media(prefers-color-scheme:dark){body{background:radial-gradient(circle at 12% -8%,rgba(183,160,106,.10),transparent 32%),radial-gradient(circle at 88% 8%,rgba(255,255,255,.035),transparent 28%),var(--bg)}}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(120deg,transparent,rgba(255,255,255,.035),transparent 70%)}
.wrap{width:min(1180px,calc(100% - 48px))}
header{background:rgba(20,21,22,.86);border-bottom:1px solid rgba(183,160,106,.22);box-shadow:0 10px 32px rgba(0,0,0,.17);backdrop-filter:blur(22px) saturate(125%);-webkit-backdrop-filter:blur(22px) saturate(125%)}
.logo{color:#c9b784;letter-spacing:.055em;text-transform:uppercase;font-family:'Playfair Display',Georgia,serif}
.back{color:#e6e2d8;background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.13);backdrop-filter:blur(14px);transition:transform .35s var(--ease),background .25s,border-color .25s,box-shadow .25s}
.back:hover{transform:translateY(-2px);background:rgba(183,160,106,.12);border-color:rgba(183,160,106,.42);box-shadow:0 8px 24px rgba(0,0,0,.18)}
main{padding-top:42px}
.hero{padding:28px 0 24px;animation:riseIn .62s var(--ease) both}
.eyebrow{color:var(--gold);letter-spacing:.19em}
.hero h1{font-family:'Playfair Display',Georgia,serif;position:relative;letter-spacing:-.025em;text-wrap:balance}
.hero h1:after{content:"";display:block;width:72px;height:3px;margin-top:17px;border-radius:99px;background:linear-gradient(90deg,var(--gold),rgba(183,160,106,.15));box-shadow:0 0 18px rgba(183,160,106,.20);transition:width .55s var(--ease)}
.hero:hover h1:after{width:108px}
.hero p,.count{color:var(--muted)}
.filters{gap:12px;margin:22px 0 18px;animation:riseIn .66s .05s var(--ease) both}
.filters input,.filters select{background:rgba(255,255,255,.5);color:var(--text);border-color:var(--line);backdrop-filter:blur(14px);transition:border-color .2s,box-shadow .2s,background .2s}
.filters select{color-scheme:dark}
.filters select option{background:#17191c;color:#f0eee8}
@media(prefers-color-scheme:dark){.filters input,.filters select{background:rgba(255,255,255,.045)}}
.filters input:focus,.filters select:focus{border-color:rgba(183,160,106,.7);box-shadow:0 0 0 3px rgba(183,160,106,.15)}
.count{font-weight:600}
.grid{gap:16px;align-items:stretch}
.card{position:relative;z-index:0;transform-origin:center;background:var(--panel);border-color:var(--line);box-shadow:0 8px 28px rgba(24,25,27,.08);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);transition:transform .42s var(--ease),box-shadow .42s var(--ease),border-color .28s;animation:riseIn .55s var(--ease) both;animation-delay:calc(var(--card-index,0)*45ms)}
.card:hover,.card:focus-visible{z-index:5;transform:translateY(-5px) scale(1.035);box-shadow:0 22px 52px rgba(24,25,27,.2);border-color:rgba(183,160,106,.62);outline:none}
.card:focus-visible{box-shadow:0 0 0 3px rgba(183,160,106,.32),0 18px 42px rgba(24,25,27,.15)}
.photo{background-color:rgba(183,160,106,.12);overflow:hidden;isolation:isolate}
.photo:before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;opacity:0;background-image:inherit;background-size:170% 170%;background-position:var(--lens-x,50%) var(--lens-y,50%);clip-path:circle(0 at var(--lens-x,50%) var(--lens-y,50%));transition:opacity .22s ease,clip-path .2s ease;filter:saturate(1.08)}
.photo:after{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 50%,rgba(10,11,12,.18)),radial-gradient(circle 78px at var(--lens-x,50%) var(--lens-y,50%),rgba(255,255,255,.34),rgba(255,255,255,.1) 55%,transparent 72%);opacity:.45;transition:opacity .2s ease}
.card:hover .photo:before,.card:focus-visible .photo:before{opacity:1;clip-path:circle(76px at var(--lens-x,50%) var(--lens-y,50%))}
.card:hover .photo:after,.card:focus-visible .photo:after{opacity:.85}
.photo .year{z-index:3;background:rgba(20,21,22,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);color:#f0eee8}
.body{padding:16px 17px 18px}
.body h3{font-family:'Playfair Display',Georgia,serif;font-size:21px;line-height:1.2}
.price{color:var(--gold);font-family:'Playfair Display',Georgia,serif}
.tag{background:rgba(183,160,106,.075);border-color:rgba(183,160,106,.18);color:var(--muted)}
.empty,.error{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);animation:riseIn .45s var(--ease) both}
dialog{background:var(--panel);color:var(--text);border-color:rgba(183,160,106,.28);backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);box-shadow:0 30px 100px rgba(0,0,0,.38);animation:dialogIn .32s var(--ease) both}
dialog::backdrop{background:rgba(12,13,14,.58);backdrop-filter:blur(5px)}
.gallery{background:rgba(183,160,106,.045)}
.mainimg{background:var(--glass-button);box-shadow:0 10px 28px rgba(0,0,0,.14)}
.thumbs button{cursor:pointer;transition:transform .25s var(--ease),border-color .2s,opacity .2s}
.thumbs button:hover{transform:translateY(-2px);opacity:.9}
.info h2{font-family:'Playfair Display',Georgia,serif;letter-spacing:-.02em}
.specs span,.specs b{border-color:var(--dialog-line)}
.specs span{color:var(--muted)}
.btn{background:linear-gradient(135deg,#c5b17c,#b7a06a);border-color:rgba(183,160,106,.68);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.22)}
.ghost{background:var(--glass-button);color:var(--text);border-color:var(--line)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes dialogIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:700px){.wrap{width:calc(100% - 32px)}.hero{padding-top:22px}.filters{gap:9px}.grid{gap:12px}}
@media(max-width:560px){.wrap{width:calc(100% - 24px)}header .wrap{min-height:66px}.logo{font-size:18px}.back{padding:9px 10px;font-size:12px}.hero h1{font-size:clamp(36px,11vw,48px)}.grid{grid-template-columns:1fr}.photo{height:230px}.info{padding:22px 18px}.info h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero,.filters,.card,.empty,.error{animation:none!important}*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}.hero h1:after{width:72px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">3 Pedals Auto KE</div><a class="back" href="index.html">← Back to website</a></div></header>
<main class="wrap">
<section class="hero"><span class="eyebrow">3 PEDALS AUTO KE</span><h1>Current inventory.</h1><p>Browse vehicles currently approved and listed for sale. Open any car to see its photos, specifications, seller details and WhatsApp contact.</p></section>
<section>
<div class="filters"><input id="q" type="search" placeholder="Search make or model"><select id="make"><option value="">All makes</option></select><select id="max"><option value="0">Any price</option><option value="1000000">Up to KES 1,000,000</option><option value="2000000">Up to KES 2,000,000</option><option value="3500000">Up to KES 3,500,000</option><option value="5000000">Up to KES 5,000,000</option></select><select id="sort"><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="km">Lowest mileage</option></select></div>
<div id="count" class="count">Loading inventory…</div><div id="grid" class="grid"></div>
</section></main>
<dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id),CFG=window.SB_CONFIG||{};const sb=CFG.url&&window.supabase?window.supabase.createClient(CFG.url,CFG.key):null;let cars=[];
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const fmt=n=>Number(n||0).toLocaleString("en-KE");const normWa=x=>{let d=String(x||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(/^0[17]\d{8}$/.test(d))return"254"+d.slice(1);if(/^[17]\d{8}$/.test(d))return"254"+d;if(/^254[17]\d{8}$/.test(d))return d;return d};
function sellerType(r){const raw=String(r?.seller_type||r?.account_type||"").trim().toLowerCase().replace(/[\s_-]+/g," ");if(["yard","dealer","car yard","car dealer","business"].includes(raw))return"yard";if(["private","private seller","individual"].includes(raw))return"private";return [r?.yard_name,r?.yard_location,r?.yard_contact].some(v=>String(v||"").trim())?"yard":"private"}
function rowToCar(r){return {id:r.id,make:r.make||"",model:r.model||"",year:r.year||"",price:r.price||0,km:r.km||0,fuel:r.fuel||"",desc:r.description||"",photos:Array.isArray(r.photos)?r.photos:[],seller:{type:sellerType(r),name:r.yard_name||r.seller_name||"",contact:r.contact||r.yard_contact||"",phone:r.seller_phone||r.phone||"",email:r.seller_email||r.email||"",web:r.web||r.yard_web||"",whatsapp:r.whatsapp||"",yard:r.yard_name||"",location:r.yard_location||r.location||""}}}
function render(){const q=$("q").value.trim().toLowerCase(),mk=$("make").value,mx=+$('max').value,s=$("sort").value;let r=cars.filter(c=>(!q||(c.make+" "+c.model).toLowerCase().includes(q))&&(!mk||c.make===mk)&&(!mx||c.price<=mx));r.sort((a,b)=>s==="low"?a.price-b.price:s==="high"?b.price-a.price:s==="km"?a.km-b.km:b.year-a.year);$("count").textContent=r.length+(r.length===1?" car":" cars")+" found";$("grid").innerHTML=r.length?r.map((c,i)=>{const p=c.photos[0];return `<button class="card" style="--card-index:${i}" data-id="${esc(c.id)}"><div class="photo" style="background-image:${p?`url('${esc(p)}')`:"none"}"><span class="year">${esc(c.year)}</span></div><div class="body"><h3>${esc(c.make)} ${esc(c.model)}</h3><div class="price">KES ${fmt(c.price)}</div><div class="tags"><span class="tag">${fmt(c.km)} km</span><span class="tag">${esc(c.fuel)}</span><span class="tag">${c.seller.type==="yard"?"Car yard / dealer":"Private seller"}</span></div></div></button>`}).join(""):`<div class="empty">No approved cars match your search right now.</div>`}
function detail(id){const c=cars.find(x=>x.id===id);if(!c)return;const d=$("dlg"),s=c.seller,ph=c.photos;const msg=encodeURIComponent(`Hello, I'm interested in the ${c.year} ${c.make} ${c.model} (KES ${fmt(c.price)}) listed on 3 Pedals Auto KE.`);const wa=s.whatsapp?`<a class="btn" href="https://wa.me/${normWa(s.whatsapp)}?text=${msg}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:"";const seller=s.type==="yard"?`<div class="specs"><span>Car yard / dealer</span><b>${esc(s.yard||s.name)}</b>${s.contact?`<span>Contact</span><b>${esc(s.contact)}</b>`:""}${s.location?`<span>Location</span><b>${esc(s.location)}</b>`:""}${s.phone?`<span>Phone</span><b><a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></b>`:""}${s.email?`<span>Email</span><b><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></b>`:""}${s.web?`<span>Website</span><b><a href="${esc(/^https?:\/\//i.test(s.web)?s.web:'https://'+s.web)}" target="_blank" rel="noopener">${esc(s.web)}</a></b>`:""}</div>`:`<div class="specs"><span>Seller</span><b>Private seller${s.name?" — "+esc(s.name):""}</b></div>`;d.innerHTML=`<div class="detail"><div class="gallery">${ph.length?`<img id="mainimg" class="mainimg" src="${esc(ph[0])}" alt="${esc(c.make+" "+c.model)}">${ph.length>1?`<div class="thumbs">${ph.map((p,i)=>`<button data-i="${i}" aria-current="${i===0}"><img src="${esc(p)}" alt=""></button>`).join("")}</div>`:""}`:`<div class="mainimg"></div>`}</div><div class="info"><h2>${esc(c.year)} ${esc(c.make)} ${esc(c.model)}</h2><div class="price">KES ${fmt(c.price)}</div><div class="specs"><span>Mileage</span><b>${fmt(c.km)} km</b><span>Fuel</span><b>${esc(c.fuel)}</b></div>${seller}<p>${esc(c.desc||"No description provided.")}</p><p style="color:var(--muted)">View the car in person, check the logbook and inspect it before making payment.</p><div class="actions">${wa}<button class="btn ghost" id="close">Close</button></div></div></div>`;d.showModal();d.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{$("mainimg").src=ph[+b.dataset.i];d.querySelectorAll(".thumbs button").forEach(x=>x.setAttribute("aria-current",x===b))});$("close").onclick=()=>d.close()}
$("grid").onclick=e=>{const b=e.target.closest(".card");if(b)detail(b.dataset.id)};
$("grid").addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const photo=e.target.closest(".photo");if(!photo)return;const r=photo.getBoundingClientRect();photo.style.setProperty("--lens-x",`${((e.clientX-r.left)/r.width)*100}%`);photo.style.setProperty("--lens-y",`${((e.clientY-r.top)/r.height)*100}%`)});
["q","make","max","sort"].forEach(id=>$(id).addEventListener("input",render));
async function load(){if(!sb||!CFG.key||/^PASTE/.test(CFG.key)){$("count").textContent="Inventory unavailable";$("grid").innerHTML='<div class="error">The inventory database is not connected. Check config.js.</div>';return}const {data,error}=await sb.from("listings").select("*").eq("status","approved").order("created_at",{ascending:false});if(error){$("count").textContent="Inventory unavailable";$("grid").innerHTML='<div class="error">We could not load the inventory right now. Please refresh in a moment.</div>';console.error(error);return}cars=(data||[]).map(rowToCar);const makes=[...new Set(cars.map(c=>c.make).filter(Boolean))].sort();$("make").innerHTML='<option value="">All makes</option>'+makes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");render()}load().catch(error=>{console.error("Could not load inventory:",error);$("count").textContent="Inventory unavailable";$("grid").innerHTML='<div class="error">We could not load the inventory right now. Please refresh and try again.</div>'});
</script>
</body></html>
